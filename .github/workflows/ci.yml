name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [dev]

jobs:
  build:
    name: Build & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run tsc --noEmit

      - name: Build
        run: bun run build
        env:
          VITE_SUPABASE_URL: "https://example.supabase.co"
          VITE_SUPABASE_PUBLISHABLE_KEY: "placeholder-for-ci"

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for secrets in tracked files
        run: |
          # Fail if .env files are tracked
          if git ls-files | grep -qE '^\.(env|env\..*)$'; then
            echo "::error::.env file is tracked in git!"
            exit 1
          fi
          # Fail if hardcoded secret VALUES appear (not env var names)
          # Patterns: Stripe live keys, Google API keys, Supabase service role JWTs
          # Excludes: Firebase client config files (google-services.json, GoogleService-Info.plist)
          # contain Google API keys that are public-by-design — restricted to bundle ID by Firebase,
          # not actual secrets. See https://firebase.google.com/docs/projects/api-keys
          if git grep -lE '(sk_live_[a-zA-Z0-9]{20,}|AIza[0-9A-Za-z_-]{35}|eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.[a-zA-Z0-9_-]{50,})' \
             -- ':!.github/' ':!*.md' ':!*.lock' \
             ':!android/app/google-services.json' \
             ':!ios/App/App/GoogleService-Info.plist' \
             ':!ios/App/App/GoogleService-Info-Dev.plist' 2>/dev/null; then
            echo "::error::Potential hardcoded secrets found in tracked files!"
            exit 1
          fi
          echo "No secrets detected"
