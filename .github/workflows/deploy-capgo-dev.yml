name: Deploy Capgo Bundle (Dev)

on:
  push:
    branches: [dev]
    paths-ignore:
      - '**.md'
      - 'obsidian_doc/**'
      - 'supabase/**'
      - '.github/workflows/deploy-supabase*.yml'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  upload:
    name: Build & upload to Capgo (dev)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build dev bundle
        run: bun run build:dev
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_DEV_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_DEV_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_DEV_SUPABASE_PROJECT_ID }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
          VITE_GOOGLE_WEB_CLIENT_ID: ${{ secrets.VITE_GOOGLE_WEB_CLIENT_ID }}
          VITE_WEB_ORIGIN: https://sessio-git-dev-mbartkovyak-6875s-projects.vercel.app

      - name: Upload to Capgo dev channel
        run: |
          # Append run_attempt so re-runs of a failed workflow upload as a new
          # unique version (Capgo blocks identical version names even after
          # deletion). Default to 1 so first attempts produce ...sha.1.
          # The 'g' before the short SHA is required: a SHA that happens to be
          # all digits with a leading zero (e.g. 0390706) is an invalid semver
          # numeric identifier and Capgo rejects the upload. 'g' makes it an
          # alphanumeric identifier (leading zeros allowed). Git uses the same
          # convention in `git describe`.
          VERSION=$(jq -r .version package.json)-dev.g$(git rev-parse --short HEAD).${GITHUB_RUN_ATTEMPT:-1}
          echo "Uploading version $VERSION"
          npx @capgo/cli@latest bundle upload --channel dev --bundle "$VERSION" --apikey "$CAPGO_APIKEY"
        env:
          CAPGO_APIKEY: ${{ secrets.CAPGO_APIKEY }}
