name: Deploy Capgo Bundle

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'obsidian_doc/**'
      - '.github/workflows/deploy-supabase*.yml'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  upload:
    name: Build & upload to Capgo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build production bundle
        run: bun run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
          VITE_GOOGLE_WEB_CLIENT_ID: ${{ secrets.VITE_GOOGLE_WEB_CLIENT_ID }}

      - name: Upload bundle to Capgo
        run: |
          VERSION=$(jq -r .version package.json)-prod.$(git rev-parse --short HEAD)
          echo "Uploading version $VERSION"
          npx @capgo/cli bundle upload --channel production --bundle "$VERSION" --apikey "$CAPGO_APIKEY"
        env:
          CAPGO_APIKEY: ${{ secrets.CAPGO_APIKEY }}
