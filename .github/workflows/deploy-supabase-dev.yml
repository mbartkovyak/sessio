name: Deploy Supabase (Dev)

on:
  push:
    branches: [dev]
    paths:
      - 'supabase/**'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  migrations:
    name: Push database migrations (dev)
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.DEV_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link dev project
        run: supabase link --project-ref ${{ secrets.DEV_PROJECT_ID }}

      - name: Push migrations
        run: yes | supabase db push

  functions:
    name: Deploy Edge Functions (dev)
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy all functions
        run: supabase functions deploy --project-ref ${{ secrets.DEV_PROJECT_ID }}
