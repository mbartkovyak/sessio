apply plugin: 'com.android.application'

// Load release signing credentials from android/keystore.properties (gitignored).
// Without this, release builds are unsigned and can't be installed on a device.
// The keystore itself lives at android/android.keystore (also gitignored) and is
// used only for local sideload testing — not for Play Store signing.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    // `namespace` stays as the Java package of MainActivity (com.get_sessio.app)
    // so we don't have to rename the Java source directory. It differs from
    // `applicationId` on purpose — namespace is the R.java / BuildConfig
    // package, applicationId is the Play Store identity. They're allowed to
    // differ and this keeps the delta minimal.
    namespace = "com.get_sessio.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        // `com.get_sessio.twa` is the package name inherited from the
        // Bubblewrap TWA listing on Play Store (the first Sessio Android
        // release). We keep it so the Capacitor AAB uploads as an update
        // to the existing listing — package names are immutable on Play
        // Store once published. The ".twa" suffix is a historical misnomer
        // (the app is no longer a TWA), but changing it would mean losing
        // the listing's install base, reviews, and store history.
        applicationId "com.get_sessio.twa"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 7
        versionName "1.2.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        debug {
            // Debug builds install as com.get_sessio.app.debug so they coexist
            // with the production TWA on a tester's device, and the version
            // name shows " (debug)" so testers can tell at a glance which
            // build they're running. Pair with `bun run build:dev` so the JS
            // bundle is baked with dev Supabase credentials.
            applicationIdSuffix ".debug"
            versionNameSuffix " (debug)"
        }
        release {
            // Release builds install as com.get_sessio.app. Pair with
            // `bun run build` so the JS bundle is baked with prod Supabase
            // credentials. Signed with the local keystore above — this is
            // for sideload testing only, NOT for Play Store submission.
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')

    // Google Credential Manager — native account picker for Google Sign-In
    // (avoids Chrome Custom Tab session issues when switching accounts)
    implementation 'androidx.credentials:credentials:1.5.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.5.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
