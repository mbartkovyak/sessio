    <div id="root">
      <!-- Inline splash — replaced by React on mount -->
      <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:#171717">
        <svg viewBox="0 0 32 32" width="80" height="80" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <filter id="sessio-glow-inline" x="-50%" y="-50%" width="200%" height="200%">
              <feGaussianBlur stdDeviation="1.2" result="blur"/>
              <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
          </defs>
          <rect width="32" height="32" rx="8" fill="hsl(0,0%,9%)"/>
          <path d="M19 9c-2-1.5-6.5-0.5-6.5 3.5 0 3.5 7 3 7 7 0 3-4 4.5-7 3" stroke="hsl(0,0%,100%)" stroke-width="2.5" stroke-linecap="round" fill="none"/>

            <animateMotion path="M19,9 c-2,-1.5,-6.5,-0.5,-6.5,3.5 c0,3.5,7,3,7,7 c0,3,-4,4.5,-7,3" dur="3s" repeatCount="indefinite" calcMode="spline" keyPoints="0;1;0" keyTimes="0;0.5;1" keySplines="0.42 0 0.58 1; 0.42 0 0.58 1"/>
            <animate attributeName="r" values="2;2.3;2;1.8;2" dur="3s" repeatCount="indefinite"/>
          </circle>
        </svg>
      </div>
    </div>
