<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html {
    background: #17140f;
  }
  body {
    width: 1024px;
    height: 500px;
    margin: 0 auto;
    overflow: hidden;
    background: linear-gradient(135deg, #17140f 0%, #1c1812 60%, #2a2418 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  .container {
    display: flex;
    align-items: center;
    gap: 0;
  }
  .logo {
    width: 160px;
    height: 160px;
    border-radius: 36px;
    flex-shrink: 0;
    margin-top: -60px;
  }
  .text {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-left: -50px;
  }
  .app-name {
    font-size: 64px;
    font-weight: 700;
    color: #ffffff;
    letter-spacing: -1px;
  }
  .tagline {
    font-size: 24px;
    font-weight: 400;
    color: rgba(255, 255, 255, 0.7);
    letter-spacing: 0.5px;
  }
  .accent {
    color: #F0A030;
  }
</style>
</head>
<body>
  <div class="container">
    <svg class="logo" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M19 9c-2-1.5-6.5-0.5-6.5 3.5 0 3.5 7 3 7 7 0 3-4 4.5-7 3" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none" />
      <circle cx="21" cy="8.5" r="2" fill="#f59e0b" />
    </svg>
    <div class="text">
      <div class="app-name">essio</div>
      <div class="tagline">Find your coach<span class="accent">.</span> Book in seconds<span class="accent">.</span></div>
    </div>
  </div>
</body>
</html>
